name: audit

# 週次の依存監査。Dependabot alert (Security タブ / メール) の保険であり、
# とくに Dependabot が PR を出せない transitive (孫依存) の脆弱性を CI 上に可視化する。
# high 以上で fail、moderate は informational (Job Summary に出すが赤くしない)。

on:
  schedule:
    # JST 月 07:00 = UTC 日 22:00
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

      - name: Audit report (moderate+, informational)
        if: always()
        run: npm audit --audit-level=moderate >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
